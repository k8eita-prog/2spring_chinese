<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TOEIC Part 6 練習</title>
<style>
  :root{
    --navy:#1a237e;
    --navy-dark:#0d1442;
    --gold:#ffc107;
    --gold-dark:#c79100;
    --bg:#f4f6fb;
    --panel:#ffffff;
    --text:#1f2330;
    --muted:#5b6478;
    --green:#2e7d32;
    --green-bg:#e8f5e9;
    --red:#c62828;
    --red-bg:#ffebee;
    --border:#dde2ee;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.65;
  }
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);
    color:#fff;
    padding:14px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    position:sticky;top:0;z-index:50;
  }
  .header-row{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:8px;
  }
  .title{
    font-weight:700;font-size:1.1rem;letter-spacing:.02em;
    display:flex;align-items:center;gap:8px;
  }
  .title-badge{
    background:var(--gold);color:var(--navy-dark);
    padding:2px 8px;border-radius:6px;font-size:.78rem;font-weight:700;
  }
  .score-box{
    display:flex;gap:10px;align-items:center;
    font-size:.85rem;
  }
  .score-pill{
    background:rgba(255,255,255,.12);
    padding:4px 10px;border-radius:20px;
    border:1px solid rgba(255,255,255,.2);
  }
  .icon-btn{
    background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);
    border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.9rem;
  }
  .icon-btn:hover{background:rgba(255,255,255,.1);}
  .progress-wrap{
    margin-top:10px;background:rgba(255,255,255,.15);height:6px;border-radius:4px;overflow:hidden;
  }
  .progress-bar{
    height:100%;background:var(--gold);width:0%;transition:width .3s;
  }
  .tabs{
    display:flex;gap:4px;background:var(--panel);
    border-bottom:1px solid var(--border);padding:8px 16px 0;
    position:sticky;top:75px;z-index:40;flex-wrap:wrap;
  }
  .tab{
    border:none;background:transparent;cursor:pointer;
    padding:10px 18px;border-radius:8px 8px 0 0;
    font-weight:600;color:var(--muted);font-size:.95rem;
  }
  .tab.active{
    background:var(--navy);color:#fff;
  }
  main{
    max-width:780px;margin:20px auto;padding:0 16px 80px;
  }
  .passage-card{
    background:var(--panel);border-radius:14px;padding:20px 22px;
    box-shadow:0 4px 14px rgba(20,30,80,.08);
    margin-bottom:18px;border-top:4px solid var(--gold);
  }
  .passage-meta{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
    font-size:.8rem;color:var(--muted);
  }
  .level-badge{
    padding:2px 8px;border-radius:6px;font-weight:700;font-size:.72rem;
  }
  .lv-beginner{background:#e3f2fd;color:#1565c0;}
  .lv-intermediate{background:#fff3e0;color:#e65100;}
  .lv-advanced{background:#fce4ec;color:#ad1457;}
  .passage-title{
    font-weight:700;font-size:1rem;color:var(--navy);margin-bottom:10px;
  }
  .passage-body{
    background:#fafbff;border:1px solid var(--border);
    border-radius:10px;padding:14px 16px;
    white-space:pre-wrap;font-size:.96rem;
    font-family:Georgia,"Times New Roman",serif;
    line-height:1.85;
  }
  .blank{
    display:inline-block;min-width:60px;border-bottom:2px solid var(--navy);
    text-align:center;color:var(--navy);font-weight:700;
    padding:0 8px;margin:0 2px;
  }
  .blank.filled{color:var(--green);border-color:var(--green);}
  .question-card{
    background:var(--panel);border-radius:12px;padding:16px 18px;
    box-shadow:0 2px 8px rgba(20,30,80,.06);margin-bottom:12px;
  }
  .q-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
  }
  .q-num{
    font-weight:700;color:var(--navy);font-size:.95rem;
  }
  .bookmark-btn{
    background:transparent;border:none;font-size:1.1rem;cursor:pointer;
    color:#bbb;
  }
  .bookmark-btn.active{color:var(--gold);}
  .options{
    display:flex;flex-direction:column;gap:8px;
  }
  .option{
    background:#fff;border:1.5px solid var(--border);
    padding:11px 14px;border-radius:8px;cursor:pointer;
    text-align:left;font-size:.95rem;
    transition:all .15s;
    display:flex;gap:10px;align-items:flex-start;
  }
  .option:hover:not(:disabled){border-color:var(--navy);background:#f0f4ff;}
  .option:disabled{cursor:default;}
  .opt-label{
    font-weight:700;color:var(--navy);min-width:18px;
  }
  .option.correct{
    background:var(--green-bg);border-color:var(--green);
  }
  .option.correct .opt-label{color:var(--green);}
  .option.incorrect{
    background:var(--red-bg);border-color:var(--red);
  }
  .option.incorrect .opt-label{color:var(--red);}
  .feedback-panel{
    margin-top:12px;background:#fffbe6;border-left:4px solid var(--gold);
    padding:12px 14px;border-radius:6px;font-size:.92rem;
    animation:slideIn .3s ease;
    display:none;
  }
  .feedback-panel.show{display:block;}
  @keyframes slideIn{
    from{opacity:0;transform:translateY(-6px);}
    to{opacity:1;transform:translateY(0);}
  }
  .feedback-result{
    font-weight:700;margin-bottom:6px;
  }
  .feedback-result.ok{color:var(--green);}
  .feedback-result.ng{color:var(--red);}
  .next-row{
    display:flex;justify-content:flex-end;gap:8px;margin-top:14px;
  }
  .primary-btn{
    background:var(--gold);color:var(--navy-dark);
    border:none;border-radius:8px;padding:10px 22px;
    font-weight:700;cursor:pointer;font-size:.95rem;
    box-shadow:0 2px 6px rgba(255,193,7,.4);
  }
  .primary-btn:hover{background:var(--gold-dark);color:#fff;}
  .secondary-btn{
    background:var(--navy);color:#fff;border:none;border-radius:8px;
    padding:10px 22px;font-weight:600;cursor:pointer;font-size:.95rem;
  }
  .summary{
    background:var(--panel);border-radius:14px;padding:30px;
    text-align:center;box-shadow:0 4px 14px rgba(20,30,80,.1);
  }
  .summary h2{color:var(--navy);margin-top:0;}
  .summary-score{
    font-size:3rem;font-weight:800;color:var(--gold);margin:10px 0;
  }
  .summary-rate{font-size:1.1rem;color:var(--muted);}
  .summary-actions{
    display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap;
  }
  /* Modal */
  .modal-bg{
    position:fixed;inset:0;background:rgba(10,20,50,.6);
    display:none;align-items:center;justify-content:center;z-index:200;
    padding:16px;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:#fff;border-radius:12px;padding:24px;max-width:480px;width:100%;
    box-shadow:0 8px 30px rgba(0,0,0,.3);
  }
  .modal h3{margin-top:0;color:var(--navy);}
  .form-group{margin-bottom:14px;}
  .form-group label{
    display:block;font-size:.85rem;font-weight:600;
    margin-bottom:4px;color:var(--muted);
  }
  .form-group input{
    width:100%;padding:8px 10px;border:1.5px solid var(--border);
    border-radius:6px;font-size:.9rem;font-family:monospace;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  /* Toast */
  .toast-wrap{
    position:fixed;right:16px;bottom:16px;z-index:300;
    display:flex;flex-direction:column;gap:8px;
  }
  .toast{
    background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.25);font-size:.88rem;
    animation:toastIn .25s ease;max-width:320px;
  }
  .toast.err{background:var(--red);}
  .toast.ok{background:var(--green);}
  @keyframes toastIn{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .empty-msg{
    background:#fff;border-radius:10px;padding:30px;text-align:center;
    color:var(--muted);
  }
  @media (max-width:600px){
    .tabs{top:90px;}
    .passage-card{padding:14px;}
    .passage-body{font-size:.9rem;padding:12px;}
    .option{font-size:.9rem;padding:10px 12px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="title">
      <span>📘 TOEIC Part 6 練習</span>
      <span class="title-badge" id="levelLabel">初級</span>
    </div>
    <div class="score-box">
      <span class="score-pill" id="scoreLabel">スコア: 0/0 (0%)</span>
      <button class="icon-btn" id="settingsBtn" title="Notion設定">⚙️</button>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progBar"></div></div>
</header>

<div class="tabs">
  <button class="tab active" data-level="beginner">初級</button>
  <button class="tab" data-level="intermediate">中級</button>
  <button class="tab" data-level="advanced">上級</button>
</div>

<main id="app"></main>

<!-- Settings Modal -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>⚙️ Notion 連携設定</h3>
    <div class="form-group">
      <label>Notion Integration Token</label>
      <input id="tokenInput" placeholder="secret_..." />
    </div>
    <div class="form-group">
      <label>セッションスコア用 DB ID</label>
      <input id="scoreDbInput" placeholder="xxxxxxxxxxxxxxxx" />
    </div>
    <div class="form-group">
      <label>苦手問題用 DB ID</label>
      <input id="mistakeDbInput" placeholder="xxxxxxxxxxxxxxxx" />
    </div>
    <div class="modal-actions">
      <button class="icon-btn" style="color:var(--navy);border-color:var(--navy);" id="cancelSettings">キャンセル</button>
      <button class="primary-btn" id="saveSettings">保存</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   Part 6 長文穴埋め 問題データ
   構成: 初級13本(52問) / 中級13本(52問) / 上級12本(48問)
   合計: 38本 / 152問
   各長文は4つの空所(blanks)を持ち、各空所に4択問題が紐づく
============================================================ */

const passages = [
/* ==================== 初級 (Beginner) 13本 ==================== */
{
  id:"b1", level:"beginner",
  title:"Office Cleaning Notice",
  body:`To: All Staff
From: Office Manager
Subject: New Cleaning Schedule

Starting next Monday, our office will (1)___ a new cleaning company. The cleaners will come every weekday evening at 7 p.m. (2)___, please make sure your desk is tidy before you leave.

If you have any items you want (3)___, please put them in a drawer. The cleaners will not touch personal belongings. We hope this change will help us keep the office (4)___ and comfortable for everyone.`,
  questions:[
    {blank:1, options:["use","used","using","to using"], answer:0,
     explanation:"助動詞 will の後には動詞の原形が来るので 'use' が正解。'used' は過去形、'using' は ing 形、'to using' は形として不適切。"},
    {blank:2, options:["However","Therefore","Although","Because"], answer:1,
     explanation:"前文「掃除員が来る」→後文「机を整理しておくように」という因果関係。だから 'Therefore（したがって）' が適切。'However' は逆接、'Although'/'Because' は接続詞で文頭副詞句として使えない。"},
    {blank:3, options:["protect","protected","protecting","protection"], answer:2,
     explanation:"want + 目的語 + to V または want + V-ing の形を取れるが、ここは 'items you want protecting'（守りたい物）の意味で動名詞が自然。受動的意味で動名詞を使う英国寄りの用法だが、TOEICでもこの形は出題される。"},
    {blank:4, options:["clean","cleanly","cleaner","cleaning"], answer:0,
     explanation:"keep + O + 形容詞（O を〜の状態に保つ）の構文。'clean'（清潔な）が適切。'cleanly' は副詞、'cleaner' は比較級で意味が合わず、'cleaning' は ing 形。"}
  ]
},
{
  id:"b2", level:"beginner",
  title:"Company Picnic Invitation",
  body:`Dear Employees,

We are happy to (1)___ you to our annual company picnic. The event will be held on Saturday, July 12, at Greenwood Park. Lunch and drinks will (2)___ provided for all attendees.

Please bring your family members. There will be games for children (3)___ live music for adults. If you plan to come, kindly reply to this email (4)___ Friday.

We look forward to seeing you there!`,
  questions:[
    {blank:1, options:["invite","invites","inviting","invited"], answer:0,
     explanation:"be happy to + 動詞の原形（〜できて嬉しい）の構文。'invite' が正解。"},
    {blank:2, options:["be","being","been","is"], answer:0,
     explanation:"will の後は原形 + 受動態 'be + 過去分詞' の形。'will be provided' で「提供される予定」。"},
    {blank:3, options:["or","but","and","so"], answer:2,
     explanation:"「子供向けのゲームと大人向けの音楽」と並列している。等位接続詞 'and' が適切。"},
    {blank:4, options:["until","by","since","for"], answer:1,
     explanation:"「金曜までに返信を」という期限を示す前置詞は 'by'。'until' は継続「〜までずっと」、'since' は起点、'for' は期間を表す。"}
  ]
},
{
  id:"b3", level:"beginner",
  title:"New Coffee Machine",
  body:`A new coffee machine has been (1)___ in the break room. It is available for all employees to use during work hours.

The machine offers several drinks (2)___ coffee, tea, and hot chocolate. Please read the instructions before using it for the first time. If you encounter any problems, (3)___ contact the maintenance team.

We kindly ask everyone to clean up after using the machine. (4)___ keeping the break room tidy helps everyone enjoy their break.`,
  questions:[
    {blank:1, options:["install","installs","installed","installing"], answer:2,
     explanation:"has been + 過去分詞（現在完了の受動態）。'installed' が正解。「設置された」。"},
    {blank:2, options:["include","includes","including","included"], answer:2,
     explanation:"「コーヒー、紅茶、ココアを含むいくつかの飲み物」。前置詞的に使われる現在分詞 'including（〜を含めて）' が正解。"},
    {blank:3, options:["please","pleased","pleasing","pleasure"], answer:0,
     explanation:"命令文を丁寧にする 'please' が正解。'please contact 〜（〜に連絡してください）'。"},
    {blank:4, options:["Your help in","Your helping","You help with","Help you with"], answer:0,
     explanation:"主語として「あなたの〜における協力」を表す名詞句 'Your help in keeping 〜' が自然。動名詞句が直後に続く形。"}
  ]
},
{
  id:"b4", level:"beginner",
  title:"Library Reopening",
  body:`The Westfield Public Library will (1)___ on Monday, March 3, after a two-month renovation. The new library features more reading rooms, computer stations, and a children's area.

(2)___ the reopening week, all visitors will receive a free bookmark. There will also be reading events for children every afternoon.

Library hours are from 9 a.m. (3)___ 8 p.m. on weekdays. On weekends, the library closes at 5 p.m. We hope to see many (4)___ visitors enjoying the new space.`,
  questions:[
    {blank:1, options:["reopen","reopens","reopened","reopening"], answer:0,
     explanation:"助動詞 will の後は動詞の原形。'reopen' が正解。"},
    {blank:2, options:["While","During","When","Since"], answer:1,
     explanation:"後に名詞句 'the reopening week' が続くので、前置詞 'During（〜の間）' が正解。'While'/'When' は接続詞、'Since' は意味が合わない。"},
    {blank:3, options:["to","at","in","by"], answer:0,
     explanation:"'from A to B（AからBまで）' のセット表現。"},
    {blank:4, options:["happy","happily","happiness","happier"], answer:0,
     explanation:"名詞 'visitors' を修飾する形容詞が必要。'happy visitors（喜ぶ訪問者）' が正解。"}
  ]
},
{
  id:"b5", level:"beginner",
  title:"Order Confirmation",
  body:`Thank you for your order with BluePine Online Store. Your order number is #45219 and (1)___ been confirmed.

Your items will be shipped within two business days. You will receive a tracking number by email (2)___ the package leaves our warehouse.

If you need to change the delivery address, please contact us (3)___ 24 hours. After that, changes may not be possible.

We appreciate your (4)___ and hope you enjoy your new items!`,
  questions:[
    {blank:1, options:["have","has","is","was"], answer:1,
     explanation:"主語は 'Your order'（単数）なので 'has been confirmed'（現在完了受動態）。"},
    {blank:2, options:["once","while","during","until"], answer:0,
     explanation:"「荷物が倉庫を出た時点で」という意味。接続詞 'once（〜したらすぐに）' が適切。"},
    {blank:3, options:["within","between","among","along"], answer:0,
     explanation:"「24時間以内に」。期間内を示す 'within' が正解。"},
    {blank:4, options:["business","busy","busily","businesses"], answer:0,
     explanation:"'your business' で「お取引・ご利用」を意味する定番表現。"}
  ]
},
{
  id:"b6", level:"beginner",
  title:"Job Posting",
  body:`Sunrise Café is (1)___ for friendly and hardworking staff. We have openings for part-time servers and one full-time kitchen assistant.

(2)___ experience is preferred, we are willing to train the right candidates. Applicants must be available on weekends.

If you are interested, please send your résumé (3)___ sunrisecafe.hr@example.com. We will contact selected applicants for an interview (4)___ one week.`,
  questions:[
    {blank:1, options:["looking","looked","looks","look"], answer:0,
     explanation:"be looking for 〜（〜を探している）の進行形。"},
    {blank:2, options:["Because","Although","Since","Unless"], answer:1,
     explanation:"「経験があれば望ましいが、訓練する用意がある」という逆接。'Although（〜だけれども）' が正解。"},
    {blank:3, options:["at","on","to","with"], answer:2,
     explanation:"send A to B（AをBに送る）。'to' が正解。"},
    {blank:4, options:["within","by","until","during"], answer:0,
     explanation:"「1週間以内に」を表す 'within'。'by' は「までに」だが期間表現は 'within'。"}
  ]
},
{
  id:"b7", level:"beginner",
  title:"Hotel Welcome Letter",
  body:`Dear Guest,

Welcome to the Lakeview Hotel. We are (1)___ to have you stay with us. Our staff is available 24 hours a day to help with any (2)___ you may have.

Breakfast is served in the main dining room from 7 a.m. to 10 a.m. The fitness center and pool are open (3)___ 6 a.m. to 10 p.m.

If you need extra towels or pillows, please call the front desk. We hope you (4)___ your stay.`,
  questions:[
    {blank:1, options:["delight","delights","delighted","delightful"], answer:2,
     explanation:"be delighted to V（〜できて嬉しい）。過去分詞由来の形容詞 'delighted'。"},
    {blank:2, options:["requests","request","requested","requesting"], answer:0,
     explanation:"'any' の後は通常複数形または不可算名詞。'any requests'（どんな要望でも）が正解。"},
    {blank:3, options:["from","at","on","in"], answer:0,
     explanation:"from A to B（A時からB時まで）。"},
    {blank:4, options:["enjoy","enjoying","enjoyed","to enjoy"], answer:0,
     explanation:"hope (that) S + V の節。動詞の原形 'enjoy' が正解。'We hope you enjoy your stay.' で定型表現。"}
  ]
},
{
  id:"b8", level:"beginner",
  title:"Gym Membership Renewal",
  body:`Dear Mr. Brown,

Your gym membership at FitLife will (1)___ on April 30. To continue using our facilities without interruption, please renew your membership before that date.

We are offering a special (2)___ for early renewals. If you renew by April 15, you will receive a 10% discount on the yearly fee.

You can renew online or (3)___ visiting the front desk. Our staff will be happy to (4)___ you.

Thank you for choosing FitLife.`,
  questions:[
    {blank:1, options:["expire","expires","expired","expiring"], answer:0,
     explanation:"will の後は動詞の原形。'expire（期限切れになる）'。"},
    {blank:2, options:["offer","offers","offering","offered"], answer:0,
     explanation:"'a special offer'（特別オファー）。冠詞 a の後の名詞単数形。"},
    {blank:3, options:["by","with","at","on"], answer:0,
     explanation:"by + 動名詞（〜することによって）。'by visiting'。"},
    {blank:4, options:["assist","assistance","assisting","assistant"], answer:0,
     explanation:"will be happy to V の不定詞。動詞原形 'assist（手伝う）' が正解。"}
  ]
},
{
  id:"b9", level:"beginner",
  title:"School Festival Announcement",
  body:`Greenview High School will hold its annual school festival on Saturday, October 18. The festival is open to (1)___, including students, parents, and members of the community.

There will be food stands, music performances, and art exhibitions. Tickets are not (2)___; the festival is free of charge.

Parking is limited, so we encourage visitors to use public transportation. Buses run every 15 minutes (3)___ the nearby train station.

We hope (4)___ will join us and enjoy this special day.`,
  questions:[
    {blank:1, options:["everyone","anyone","someone","no one"], answer:0,
     explanation:"「皆さんに開かれている」という意味。'everyone' が自然。"},
    {blank:2, options:["require","required","requirement","requires"], answer:1,
     explanation:"be 動詞 + 過去分詞（受動態）。'Tickets are not required（チケットは不要）'。"},
    {blank:3, options:["from","at","with","on"], answer:0,
     explanation:"「最寄り駅から」。起点を示す 'from'。"},
    {blank:4, options:["many people","much people","more peoples","each people"], answer:0,

/* ============================================================
   問題のフラット化（passage → 個別質問）
============================================================ */
function flattenQuestions(level){
  const list = [];
  passages.filter(p => p.level === level).forEach(p => {
    p.questions.forEach((q, idx) => {
      list.push({
        passageId: p.id,
        passageTitle: p.title,
        passageBody: p.body,
        level: p.level,
        blank: q.blank,
        options: q.options,
        answer: q.answer,
        explanation: q.explanation,
        questionIndex: idx,
        totalInPassage: p.questions.length
      });
    });
  });
  return list;
}

/* ============================================================
   ユーティリティ
============================================================ */
function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* シャッフルは passage 単位で行う（passage 内の問題順は維持） */
function shufflePassages(level){
  const ps = passages.filter(p => p.level === level);
  const shuffled = shuffleArray(ps);
  const flat = [];
  shuffled.forEach(p => {
    p.questions.forEach((q, idx) => {
      flat.push({
        passageId: p.id,
        passageTitle: p.title,
        passageBody: p.body,
        level: p.level,
        blank: q.blank,
        options: q.options,
        answer: q.answer,
        explanation: q.explanation,
        questionIndex: idx,
        totalInPassage: p.questions.length,
        passageRef: p
      });
    });
  });
  return flat;
}

/* ============================================================
   State
============================================================ */
const state = {
  level: "beginner",
  questions: [],
  current: 0,
  correct: 0,
  answered: 0,
  finished: false,
  bookmarks: new Set(),
  // 現在 passage 内の答え状況
  currentPassageAnswers: {} // {passageId: [selectedIndex, ...]}
};

const NOTION_KEYS = {
  token: "toeic_p6_notion_token",
  scoreDb: "toeic_p6_notion_score_db",
  mistakeDb: "toeic_p6_notion_mistake_db"
};

/* ============================================================
   レベル切替・初期化
============================================================ */
function startLevel(level){
  state.level = level;
  state.questions = shufflePassages(level);
  state.current = 0;
  state.correct = 0;
  state.answered = 0;
  state.finished = false;
  state.currentPassageAnswers = {};
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.level === level);
  });
  document.getElementById("levelLabel").textContent =
    level === "beginner" ? "初級" : level === "intermediate" ? "中級" : "上級";
  render();
}

/* ============================================================
   描画
============================================================ */
function render(){
  const app = document.getElementById("app");
  if(state.finished){
    renderSummary();
    return;
  }
  if(state.questions.length === 0){
    app.innerHTML = `<div class="empty-msg">問題が見つかりません。</div>`;
    return;
  }

  const q = state.questions[state.current];
  const passage = q.passageRef;
  const passageAns = state.currentPassageAnswers[q.passageId] || {};

  // 長文の表示（空所には選択済みなら選択肢を入れる）
  const renderedBody = passage.body.replace(/\((\d+)\)___/g, (_, num) => {
    const n = parseInt(num, 10);
    if(passageAns[n] !== undefined){
      const filled = passage.questions.find(qq => qq.blank === n);
      const txt = filled.options[passageAns[n]];
      return `<span class="blank filled">(${num}) ${escapeHTML(txt)}</span>`;
    }
    if(n === q.blank){
      return `<span class="blank">(${num}) ___</span>`;
    }
    return `<span class="blank">(${num}) ___</span>`;
  });

  const levelClass = "lv-" + q.level;
  const levelText = q.level === "beginner" ? "初級" : q.level === "intermediate" ? "中級" : "上級";

  app.innerHTML = `
    <div class="passage-card">
      <div class="passage-meta">
        <span class="level-badge ${levelClass}">${levelText}</span>
        <span>パッセージ: ${escapeHTML(q.passageTitle)}</span>
        <span>· 第 ${q.questionIndex + 1} / ${q.totalInPassage} 問</span>
      </div>
      <div class="passage-title">${escapeHTML(q.passageTitle)}</div>
      <div class="passage-body">${renderedBody}</div>
    </div>

    <div class="question-card">
      <div class="q-header">
        <div class="q-num">問 ${state.current + 1} / ${state.questions.length}　（空所 ${q.blank}）</div>
        <button class="bookmark-btn ${state.bookmarks.has(makeQKey(q)) ? "active" : ""}" id="bookmarkBtn" title="苦手登録">★</button>
      </div>
      <div class="options" id="optionsBox">
        ${q.options.map((opt, i) => `
          <button class="option" data-index="${i}">
            <span class="opt-label">(${String.fromCharCode(65+i)})</span>
            <span>${escapeHTML(opt)}</span>
          </button>
        `).join("")}
      </div>
      <div class="feedback-panel" id="feedback"></div>
      <div class="next-row" id="nextRow" style="display:none;">
        <button class="primary-btn" id="nextBtn">次の問題 →</button>
      </div>
    </div>
  `;

  // イベント登録
  document.querySelectorAll("#optionsBox .option").forEach(btn => {
    btn.addEventListener("click", () => selectOption(parseInt(btn.dataset.index, 10)));
  });
  document.getElementById("bookmarkBtn").addEventListener("click", () => {
    toggleBookmark(q);
    render();
  });

  updateHeader();
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function makeQKey(q){
  return q.passageId + "-" + q.blank;
}

function toggleBookmark(q){
  const k = makeQKey(q);
  if(state.bookmarks.has(k)) state.bookmarks.delete(k);
  else state.bookmarks.add(k);
}

function updateHeader(){
  const total = state.questions.length;
  const rate = state.answered === 0 ? 0 : Math.round((state.correct / state.answered) * 100);
  document.getElementById("scoreLabel").textContent =
    `スコア: ${state.correct}/${state.answered} (${rate}%)`;
  document.getElementById("progBar").style.width =
    ((state.current) / total * 100) + "%";
}

/* ============================================================
   回答
============================================================ */
function selectOption(idx){
  const q = state.questions[state.current];
  const opts = document.querySelectorAll("#optionsBox .option");
  opts.forEach(o => o.disabled = true);

  const correct = (idx === q.answer);
  state.answered++;
  if(correct) state.correct++;

  // 表示
  opts.forEach((o, i) => {
    if(i === q.answer) o.classList.add("correct");
    else if(i === idx) o.classList.add("incorrect");
  });

  // 解説パネル
  const fb = document.getElementById("feedback");
  fb.classList.add("show");
  fb.innerHTML = `
    <div class="feedback-result ${correct ? "ok" : "ng"}">
      ${correct ? "✅ 正解！" : "❌ 不正解"}
    </div>
    <div><strong>正解：</strong>(${String.fromCharCode(65+q.answer)}) ${escapeHTML(q.options[q.answer])}</div>
    <div style="margin-top:6px;"><strong>解説：</strong>${escapeHTML(q.explanation)}</div>
  `;

  document.getElementById("nextRow").style.display = "flex";
  document.getElementById("nextBtn").addEventListener("click", goNext);

  // 長文に選択結果を反映
  if(!state.currentPassageAnswers[q.passageId]) state.currentPassageAnswers[q.passageId] = {};
  state.currentPassageAnswers[q.passageId][q.blank] = idx;

  updateHeader();

  // Notion 送信（不正解時）
  if(!correct){
    sendMistakeToNotion(q, idx);
  }
}

function goNext(){
  state.current++;
  // 次の passage に移ったら currentPassageAnswers をリセットしない
  // （表示の連続性を保つため）
  if(state.current >= state.questions.length){
    state.finished = true;
    sendScoreToNotion();
  }
  render();
}

/* ============================================================
   サマリ
============================================================ */
function renderSummary(){
  const app = document.getElementById("app");
  const total = state.questions.length;
  const rate = total === 0 ? 0 : Math.round((state.correct / total) * 100);
  const levelText = state.level === "beginner" ? "初級" : state.level === "intermediate" ? "中級" : "上級";

  app.innerHTML = `
    <div class="summary">
      <h2>🎉 ${levelText} 完了！</h2>
      <div class="summary-score">${state.correct} / ${total}</div>
      <div class="summary-rate">正答率 ${rate}%</div>
      <div class="summary-actions">
        <button class="primary-btn" id="retryBtn">もう一度</button>
        <button class="secondary-btn" id="otherLevelBtn">別レベルへ</button>
      </div>
    </div>
  `;
  document.getElementById("retryBtn").addEventListener("click", () => startLevel(state.level));
  document.getElementById("otherLevelBtn").addEventListener("click", () => {
    document.querySelector(".tabs").scrollIntoView({behavior:"smooth"});
  });
  document.getElementById("progBar").style.width = "100%";
}

/* ============================================================
   Notion 連携
============================================================ */
function getNotionConfig(){
  return {
    token: localStorage.getItem(NOTION_KEYS.token) || "",
    scoreDb: localStorage.getItem(NOTION_KEYS.scoreDb) || "",
    mistakeDb: localStorage.getItem(NOTION_KEYS.mistakeDb) || ""
  };
}

function saveNotionConfig(){
  localStorage.setItem(NOTION_KEYS.token, document.getElementById("tokenInput").value.trim());
  localStorage.setItem(NOTION_KEYS.scoreDb, document.getElementById("scoreDbInput").value.trim());
  localStorage.setItem(NOTION_KEYS.mistakeDb, document.getElementById("mistakeDbInput").value.trim());
  closeSettings();
  toast("✅ Notion設定を保存しました", "ok");
}

function openSettings(){
  const c = getNotionConfig();
  document.getElementById("tokenInput").value = c.token;
  document.getElementById("scoreDbInput").value = c.scoreDb;
  document.getElementById("mistakeDbInput").value = c.mistakeDb;
  document.getElementById("settingsModal").classList.add("show");
}
function closeSettings(){
  document.getElementById("settingsModal").classList.remove("show");
}

async function notionCreatePage(databaseId, properties){
  const c = getNotionConfig();
  if(!c.token || !databaseId) return null;
  try{
    const res = await fetch("https://api.notion.com/v1/pages", {
      method:"POST",
      headers:{
        "Authorization": "Bearer " + c.token,
        "Notion-Version": "2022-06-28",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        parent: { database_id: databaseId },
        properties: properties
      })
    });
    if(!res.ok){
      const t = await res.text();
      throw new Error(res.status + " " + t.slice(0,120));
    }
    return await res.json();
  }catch(e){
    toast("Notion送信失敗：" + e.message, "err");
    return null;
  }
}

async function sendMistakeToNotion(q, selectedIdx){
  const c = getNotionConfig();
  if(!c.token || !c.mistakeDb) return;
  const levelText = q.level === "beginner" ? "初級" : q.level === "intermediate" ? "中級" : "上級";
  // 問題全文：passage の空所を強調表示
  const fullText = q.passageBody.replace(`(${q.blank})___`, `【★(${q.blank})___】`);
  const titleText = (q.passageTitle + " - 空所" + q.blank).slice(0, 30);

  const props = {
    "タイトル": { title: [{ text: { content: titleText } }] },
    "Part": { select: { name: "Part 6" } },
    "レベル": { select: { name: levelText } },
    "問題全文": { rich_text: [{ text: { content: fullText.slice(0, 1900) } }] },
    "自分の解答": { rich_text: [{ text: { content: q.options[selectedIdx] } }] },
    "正解": { rich_text: [{ text: { content: q.options[q.answer] } }] },
    "解説": { rich_text: [{ text: { content: q.explanation.slice(0, 1900) } }] },
    "間違えた日": { date: { start: new Date().toISOString() } }
  };
  const result = await notionCreatePage(c.mistakeDb, props);
  if(result) toast("✅ 苦手問題をNotionに記録", "ok");
}

async function sendScoreToNotion(){
  const c = getNotionConfig();
  if(!c.token || !c.scoreDb) return;
  const levelText = state.level === "beginner" ? "初級" : state.level === "intermediate" ? "中級" : "上級";
  const total = state.questions.length;
  const rate = total === 0 ? 0 : Math.round((state.correct / total) * 100);
  const today = new Date().toISOString().slice(0, 10);
  const props = {
    "タイトル": { title: [{ text: { content: `Part 6 ${levelText} ${today}` } }] },
    "Part": { select: { name: "Part 6" } },
    "レベル": { select: { name: levelText } },
    "正答数": { number: state.correct },
    "出題数": { number: total },
    "正答率": { number: rate },
    "学習日": { date: { start: new Date().toISOString() } }
  };
  const result = await notionCreatePage(c.scoreDb, props);
  if(result) toast("✅ セッションスコアをNotionに記録", "ok");
}

/* ============================================================
   Toast
============================================================ */
function toast(msg, type){
  const wrap = document.getElementById("toastWrap");
  const t = document.createElement("div");
  t.className = "toast " + (type || "");
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => {
    t.style.transition = "opacity .3s";
    t.style.opacity = "0";
    setTimeout(() => t.remove(), 300);
  }, 2200);
}

/* ============================================================
   イベント・起動
============================================================ */
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => startLevel(t.dataset.level));
});
document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("saveSettings").addEventListener("click", saveNotionConfig);
document.getElementById("cancelSettings").addEventListener("click", closeSettings);
document.getElementById("settingsModal").addEventListener("click", (e) => {
  if(e.target.id === "settingsModal") closeSettings();
});

// 初回起動：Notion未設定なら案内（ただし強制ではない）
window.addEventListener("DOMContentLoaded", () => {
  startLevel("beginner");
  const c = getNotionConfig();
  if(!c.token){
    setTimeout(() => toast("⚙️ 右上の設定からNotion連携を有効にできます", ""), 500);
  }
});
</script>
