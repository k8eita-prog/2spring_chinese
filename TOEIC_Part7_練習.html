<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC Part 7 練習</title>
<style>
  /* ==================== ベース ==================== */
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
    background:linear-gradient(135deg,#f5f7fa 0%,#e8ecf3 100%);
    color:#1a237e;min-height:100vh;line-height:1.6;
  }
  /* ==================== ヘッダー ==================== */
  header{
    background:linear-gradient(135deg,#1a237e 0%,#283593 100%);
    color:#fff;padding:16px 24px;box-shadow:0 4px 12px rgba(26,35,126,0.2);
    position:sticky;top:0;z-index:100;
  }
  .header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .app-title{font-size:1.4em;font-weight:700;display:flex;align-items:center;gap:8px}
  .app-title .badge{background:#ffc107;color:#1a237e;padding:2px 10px;border-radius:12px;font-size:0.7em;font-weight:700}
  .header-right{display:flex;align-items:center;gap:12px;font-size:0.9em}
  .score-display{background:rgba(255,193,7,0.2);padding:6px 14px;border-radius:20px;border:1px solid #ffc107}
  .settings-btn{background:transparent;border:1px solid #ffc107;color:#ffc107;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1em;transition:all 0.2s}
  .settings-btn:hover{background:#ffc107;color:#1a237e}
  /* ==================== レベルタブ ==================== */
  .level-tabs{display:flex;gap:4px;margin-top:14px;background:rgba(0,0,0,0.15);padding:4px;border-radius:10px}
  .level-tab{flex:1;padding:10px 14px;background:transparent;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all 0.2s;font-size:0.95em}
  .level-tab.active{background:#ffc107;color:#1a237e;box-shadow:0 2px 8px rgba(255,193,7,0.4)}
  .level-tab:hover:not(.active){background:rgba(255,255,255,0.1)}
  /* ==================== 進捗バー ==================== */
  .progress-wrap{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:0.85em}
  .progress-bar{flex:1;height:8px;background:rgba(0,0,0,0.2);border-radius:4px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,#ffc107,#ffeb3b);transition:width 0.3s;width:0%}
  /* ==================== メイン ==================== */
  main{max-width:880px;margin:0 auto;padding:24px 16px;}
  .passage-card{
    background:#fff;border-radius:14px;padding:24px;margin-bottom:20px;
    box-shadow:0 4px 16px rgba(26,35,126,0.08);border-left:5px solid #ffc107;
  }
  .passage-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .passage-type{background:#1a237e;color:#fff;padding:4px 12px;border-radius:10px;font-size:0.8em;font-weight:600}
  .q-counter{color:#666;font-size:0.85em}
  .passage-text{
    background:#fafbfc;border:1px solid #e0e4ec;border-radius:10px;
    padding:18px;font-family:Georgia,"Times New Roman",serif;color:#222;
    white-space:pre-wrap;line-height:1.75;font-size:0.98em;
  }
  .passage-text .doc-header{font-weight:700;border-bottom:1px solid #ccc;padding-bottom:6px;margin-bottom:10px;color:#1a237e}
  .question-card{
    background:#fff;border-radius:14px;padding:24px;margin-bottom:16px;
    box-shadow:0 4px 16px rgba(26,35,126,0.08);
  }
  .q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .q-number{background:#1a237e;color:#ffc107;padding:6px 14px;border-radius:10px;font-weight:700;font-size:0.9em}
  .q-text{font-size:1.05em;font-weight:600;color:#1a237e;margin-bottom:16px;padding:10px 0;border-bottom:2px dashed #e0e4ec}
  /* ==================== 選択肢 ==================== */
  .options{display:flex;flex-direction:column;gap:10px}
  .option{
    background:#f5f7fa;border:2px solid #e0e4ec;border-radius:10px;
    padding:14px 18px;text-align:left;cursor:pointer;font-size:1em;
    color:#333;transition:all 0.2s;display:flex;align-items:flex-start;gap:10px;
    font-family:inherit;line-height:1.5;
  }
  .option:hover:not(:disabled){background:#fff8e1;border-color:#ffc107;transform:translateX(4px)}
  .option:disabled{cursor:default}
  .option-label{
    background:#1a237e;color:#ffc107;width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:0.85em;
  }
  .option.correct{background:#e8f5e9;border-color:#4caf50;color:#1b5e20}
  .option.correct .option-label{background:#4caf50;color:#fff}
  .option.wrong{background:#ffebee;border-color:#f44336;color:#b71c1c}
  .option.wrong .option-label{background:#f44336;color:#fff}
  .option-icon{margin-left:auto;font-size:1.2em}
  /* ==================== 解説パネル ==================== */
  .explanation{
    margin-top:16px;background:linear-gradient(135deg,#fff8e1 0%,#fffde7 100%);
    border-left:4px solid #ffc107;border-radius:8px;padding:16px;
    animation:slideIn 0.4s ease-out;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  .explanation h4{color:#1a237e;margin-bottom:8px;font-size:1em}
  .explanation p{color:#444;font-size:0.95em;white-space:pre-wrap}
  .next-btn{
    margin-top:16px;background:linear-gradient(135deg,#1a237e 0%,#283593 100%);
    color:#ffc107;border:none;padding:12px 24px;border-radius:10px;cursor:pointer;
    font-size:1em;font-weight:700;width:100%;transition:all 0.2s;
  }
  .next-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(26,35,126,0.3)}
  /* ==================== サマリ画面 ==================== */
  .summary{
    background:#fff;border-radius:14px;padding:32px;text-align:center;
    box-shadow:0 4px 16px rgba(26,35,126,0.08);
  }
  .summary h2{color:#1a237e;margin-bottom:20px;font-size:1.6em}
  .score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:24px 0}
  .score-box{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;padding:20px;border-radius:12px}
  .score-box .lv{font-size:0.9em;opacity:0.85;margin-bottom:6px}
  .score-box .num{font-size:1.8em;font-weight:700;color:#ffc107}
  .score-box .pct{font-size:0.85em;opacity:0.9;margin-top:4px}
  .summary-buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}
  .summary-buttons button{
    background:#1a237e;color:#ffc107;border:none;padding:12px 24px;
    border-radius:10px;cursor:pointer;font-size:0.95em;font-weight:600;
  }
  .summary-buttons button:hover{background:#283593}
  /* ==================== 設定モーダル ==================== */
  .modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center;z-index:200}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:14px;padding:28px;max-width:520px;width:90%;max-height:85vh;overflow-y:auto}
  .modal h2{color:#1a237e;margin-bottom:16px}
  .modal label{display:block;margin-top:14px;font-weight:600;color:#1a237e;font-size:0.95em}
  .modal input{width:100%;padding:10px 12px;border:2px solid #e0e4ec;border-radius:8px;margin-top:6px;font-family:inherit;font-size:0.95em}
  .modal input:focus{outline:none;border-color:#ffc107}
  .modal-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .modal-buttons button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
  .modal-buttons .save{background:#1a237e;color:#ffc107}
  .modal-buttons .cancel{background:#e0e4ec;color:#1a237e}
  .modal small{color:#666;font-size:0.8em;display:block;margin-top:4px}
  /* ==================== トースト ==================== */
  .toast{
    position:fixed;bottom:24px;right:24px;background:#1a237e;color:#fff;
    padding:14px 20px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,0.25);
    z-index:300;animation:toastIn 0.3s;max-width:340px;font-size:0.9em;
  }
  .toast.error{background:#b71c1c}
  .toast.success{background:#2e7d32}
  @keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  /* ==================== レスポンシブ ==================== */
  @media(max-width:600px){
    .app-title{font-size:1.1em}
    .level-tab{font-size:0.85em;padding:8px 10px}
    .passage-card,.question-card{padding:18px}
    .passage-text{font-size:0.92em;padding:14px}
    .option{font-size:0.92em;padding:12px 14px}
    .score-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="app-title">📖 TOEIC Part 7 練習 <span class="badge" id="levelBadge">初級</span></div>
    <div class="header-right">
      <div class="score-display" id="scoreDisplay">スコア: 0 / 0</div>
      <button class="settings-btn" id="settingsBtn" title="Notion設定">⚙️</button>
    </div>
  </div>
  <div class="level-tabs">
    <button class="level-tab active" data-level="beginner">初級 (50問)</button>
    <button class="level-tab" data-level="intermediate">中級 (50問)</button>
    <button class="level-tab" data-level="advanced">上級 (50問)</button>
  </div>
  <div class="progress-wrap">
    <span id="progressText">0 / 0</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</header>

<main id="main"></main>

<!-- 設定モーダル -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>⚙️ Notion連携設定</h2>
    <p style="color:#666;font-size:0.9em">セッションスコアと苦手問題をNotionへ自動送信します。空欄の場合は送信されません。</p>
    <label>Notion Integration Token
      <input type="text" id="notionToken" placeholder="secret_..." autocomplete="off">
      <small>Notion → My integrations から取得</small>
    </label>
    <label>セッションスコアDB の ID
      <input type="text" id="scoreDbId" placeholder="例: abc123def456..." autocomplete="off">
    </label>
    <label>苦手問題DB の ID
      <input type="text" id="mistakeDbId" placeholder="例: xyz789..." autocomplete="off">
    </label>
    <div class="modal-buttons">
      <button class="cancel" id="modalCancel">キャンセル</button>
      <button class="save" id="modalSave">保存</button>
    </div>
  </div>
</div>

<script>
/* ==================== 問題データ ==================== */
/* Part 7: シングルパッセージ + 設問2〜4問のセット形式
   passages配列: 各要素 = { id, level, type, title, body, questions:[ {q, options, answer, explanation} ] }
   合計150問（初級50・中級50・上級50） */
const passages = [
  // ============================================================
  // 初級レベル（50問）約17パッセージ
  // ============================================================
  {
    id:"b01", level:"beginner", type:"Email",
    title:"E-mail",
    body:"From: Sarah Mills <s.mills@brightcafe.com>\nTo: All Staff\nDate: March 5\nSubject: New Opening Hours\n\nDear team,\n\nStarting next Monday, Bright Cafe will open at 7:00 A.M. instead of 8:00 A.M. The closing time will remain the same at 9:00 P.M. Please arrive at least 15 minutes before your shift starts.\n\nIf you have any questions, please talk to me directly.\n\nThank you,\nSarah",
    questions:[
      { q:"What is the purpose of the e-mail?",
        options:["To announce a change in hours","To welcome a new employee","To report a customer complaint","To order new equipment"],
        answer:0,
        explanation:"件名 'New Opening Hours' と本文の 'Bright Cafe will open at 7:00 A.M. instead of 8:00 A.M.' から、営業時間の変更通知が目的。他の選択肢は本文に言及なし。" },
      { q:"What time will the cafe open from next Monday?",
        options:["7:00 A.M.","8:00 A.M.","9:00 A.M.","9:00 P.M."],
        answer:0,
        explanation:"'open at 7:00 A.M. instead of 8:00 A.M.' とあり、新しい開店時刻は7時。9:00 P.M.は閉店時刻なので不正解。" },
      { q:"What are employees asked to do?",
        options:["Send an e-mail to Sarah","Arrive 15 minutes before their shift","Work longer hours","Close the cafe earlier"],
        answer:1,
        explanation:"'Please arrive at least 15 minutes before your shift starts.' と明記。Sarahには 'talk to' とあるのでメールではない。" }
    ]
  },
  {
    id:"b02", level:"beginner", type:"Notice",
    title:"Notice",
    body:"NOTICE TO ALL RESIDENTS\n\nThe elevator in Building A will be out of service from Tuesday, April 12, to Thursday, April 14, for routine maintenance. During this period, please use the stairs or the elevator in Building B.\n\nWe apologize for any inconvenience.\n\nGreen Park Apartments Management",
    questions:[
      { q:"Who is the notice for?",
        options:["Building workers","Apartment residents","Visitors only","Maintenance staff"],
        answer:1,
        explanation:"'NOTICE TO ALL RESIDENTS' から住人向け。workersやvisitorsは対象外。" },
      { q:"How long will the elevator be out of service?",
        options:["One day","Two days","Three days","One week"],
        answer:2,
        explanation:"4月12日（火）から4月14日（木）まで、計3日間。日付の数え方に注意。" },
      { q:"What should residents do during the maintenance?",
        options:["Move to Building B","Use the stairs or another elevator","Pay an extra fee","Contact the management"],
        answer:1,
        explanation:"'please use the stairs or the elevator in Building B' と明示。引っ越しや料金の話は出てこない。" }
    ]
  },
  {
    id:"b03", level:"beginner", type:"Advertisement",
    title:"Advertisement",
    body:"SUMMER SALE at Lotus Bookstore!\n\nGet 20% off all paperback books from July 1 to July 15. Members get an extra 5% discount with their membership card. Show this advertisement at the cash register to receive your discount.\n\nVisit us at 45 Main Street or shop online at www.lotusbooks.com.",
    questions:[
      { q:"What is being advertised?",
        options:["A new bookstore","A sale on books","A membership program","A delivery service"],
        answer:1,
        explanation:"見出し 'SUMMER SALE' と '20% off all paperback books' から、書籍のセール広告。新店オープンの記述はない。" },
      { q:"How can members get an extra discount?",
        options:["By visiting the store online","By bringing a friend","By showing a membership card","By buying ten books"],
        answer:2,
        explanation:"'Members get an extra 5% discount with their membership card' から、会員カードを提示すれば追加割引が受けられる。" },
      { q:"When does the sale end?",
        options:["July 1","July 5","July 15","July 20"],
        answer:2,
        explanation:"'from July 1 to July 15' とあり、7月15日が最終日。" }
    ]
  },
  {
    id:"b04", level:"beginner", type:"Text Message",
    title:"Text Message",
    body:"From: Daniel (Manager)\nTime: 10:15 A.M.\n\nHi team, the meeting that was scheduled for 2:00 P.M. today has been moved to 3:30 P.M. We will meet in Conference Room B instead of Room A. Please bring the sales report from last month. Thanks!",
    questions:[
      { q:"Why did Daniel send the message?",
        options:["To cancel the meeting","To inform staff of changes","To ask for a sales report deadline","To welcome a new team member"],
        answer:1,
        explanation:"会議の時間と部屋の変更を伝えるのが目的。キャンセルではなく時間変更。新人歓迎にも触れていない。" },
      { q:"Where will the meeting be held?",
        options:["Conference Room A","Conference Room B","The manager's office","The cafeteria"],
        answer:1,
        explanation:"'We will meet in Conference Room B instead of Room A' と明記。Room Aは元の場所。" },
      { q:"What does Daniel ask the team to bring?",
        options:["A laptop","Last month's sales report","Lunch","A camera"],
        answer:1,
        explanation:"'Please bring the sales report from last month' と直接指示。" }
    ]
  },
  {
    id:"b05", level:"beginner", type:"Memo",
    title:"Memo",
    body:"MEMO\n\nTo: All Staff\nFrom: HR Department\nDate: September 10\nSubject: Office Cleaning\n\nThe office will be cleaned this Saturday. Please clear your desk before you leave on Friday. Personal items left on the desk may be moved or thrown away. The cleaning team will start at 9:00 A.M. and finish by noon.",
    questions:[
      { q:"When will the cleaning take place?",
        options:["Friday morning","Friday evening","Saturday morning","Sunday afternoon"],
        answer:2,
        explanation:"'this Saturday' に '9:00 A.M.' から始まると明記。土曜午前が正解。" },
      { q:"What should employees do before Friday?",
        options:["Buy cleaning supplies","Clear their desks","Send a report","Stay home"],
        answer:1,
        explanation:"'Please clear your desk before you leave on Friday' と明確に指示。" },
      { q:"What may happen to items left on desks?",
        options:["They will be locked","They may be moved or discarded","They will be donated","They will be photographed"],
        answer:1,
        explanation:"'Personal items left on the desk may be moved or thrown away' とあり、移動か廃棄。寄付には触れていない。" }
    ]
  },
  {
    id:"b06", level:"beginner", type:"Email",
    title:"E-mail",
    body:"From: Customer Service <support@greenmart.com>\nTo: Karen Lee\nSubject: Your Order #45821\n\nDear Ms. Lee,\n\nThank you for your order. Your package was shipped today and should arrive within 3 to 5 business days. You can track your delivery on our website using your order number.\n\nIf you have any questions, please call us at 555-0142.\n\nGreen Mart Customer Service",
    questions:[
      { q:"Why was the e-mail sent?",
        options:["To confirm payment","To notify a shipment","To request a review","To advertise a sale"],
        answer:1,
        explanation:"'Your package was shipped today' から、発送通知が目的。支払い確認やレビュー依頼ではない。" },
      { q:"How can Ms. Lee track her package?",
        options:["By calling the store","On the company's website","Through a mobile app","By visiting the store"],
        answer:1,
        explanation:"'You can track your delivery on our website' とウェブサイトでの追跡を案内。電話は質問用。" }
    ]
  },
  {
    id:"b07", level:"beginner", type:"Notice",
    title:"Notice",
    body:"CITY LIBRARY — Special Event\n\nJoin us this Sunday for a free children's reading event from 10:00 A.M. to 11:30 A.M. The event is open to children aged 4 to 8. Registration is not required, but seating is limited.\n\nFor more information, call 555-0200.",
    questions:[
      { q:"Who can attend the event?",
        options:["All library members","Children aged 4 to 8","Teenagers","Adults only"],
        answer:1,
        explanation:"'The event is open to children aged 4 to 8' と対象年齢を明記。" },
      { q:"What is true about the event?",
        options:["It costs $5","Registration is necessary","Seating is limited","It lasts all day"],
        answer:2,
        explanation:"'seating is limited' と本文にある。Registration is not required なので登録不要、料金は free（無料）。" }
    ]
  },
  {
    id:"b08", level:"beginner", type:"Schedule",
    title:"Schedule",
    body:"Riverside Hotel — Weekend Activities\n\nSaturday\n9:00 A.M. — Morning Yoga (Garden)\n11:00 A.M. — Cooking Class (Kitchen)\n2:00 P.M. — Hotel Tour (Lobby)\n\nSunday\n10:00 A.M. — Bike Tour (Front Entrance)\n3:00 P.M. — Tea Tasting (Lounge)\n\nAll activities are free for hotel guests.",
    questions:[
      { q:"Where will the cooking class take place?",
        options:["In the garden","In the kitchen","In the lobby","In the lounge"],
        answer:1,
        explanation:"'11:00 A.M. — Cooking Class (Kitchen)' から、場所はキッチン。" },
      { q:"What is true about the activities?",
        options:["They cost extra","They are for guests only","They are held only on Sunday","They require booking"],
        answer:1,
        explanation:"'free for hotel guests' から宿泊客向けで無料。費用や予約には触れず。" },
      { q:"What activity starts at 3:00 P.M.?",
        options:["Yoga","Bike Tour","Tea Tasting","Hotel Tour"],
        answer:2,
        explanation:"日曜3:00 P.M.は 'Tea Tasting (Lounge)'。" }
    ]
  },
  {
    id:"b09", level:"beginner", type:"Email",
    title:"E-mail",
    body:"From: Mark Wilson\nTo: Linda Park\nSubject: Lunch Meeting\n\nHi Linda,\n\nAre you free for lunch on Thursday at 12:30 P.M.? I would like to discuss the new project with you. There is a nice Italian restaurant near our office called Bella Pasta. Let me know if it works for you.\n\nBest,\nMark",
    questions:[
      { q:"Why is Mark writing to Linda?",
        options:["To cancel a project","To invite her to lunch","To recommend a hotel","To send a contract"],
        answer:1,
        explanation:"'Are you free for lunch on Thursday' とランチへの誘いが目的。プロジェクトの議論はランチの理由。" },
      { q:"What does Mark suggest?",
        options:["A morning meeting","An Italian restaurant","A new office","A long trip"],
        answer:1,
        explanation:"'a nice Italian restaurant near our office called Bella Pasta' と提案している。" }
    ]
  },
  {
    id:"b10", level:"beginner", type:"Notice",
    title:"Notice",
    body:"Parking Notice\n\nThe west parking lot will be closed on Friday for repaving. Please use the east parking lot during the day. Cars left in the west lot after 7:00 A.M. on Friday will be towed at the owner's expense.\n\nThank you for your cooperation.\nFacility Management",
    questions:[
      { q:"What is the notice mainly about?",
        options:["A new parking fee","A parking lot closure","A road repair","A new building"],
        answer:1,
        explanation:"'The west parking lot will be closed on Friday for repaving' から駐車場の閉鎖通知。料金や新築には触れていない。" },
      { q:"What will happen to cars left in the west lot?",
        options:["They will be cleaned","They will be towed","They will be repainted","They will be parked free"],
        answer:1,
        explanation:"'will be towed at the owner's expense' とあり、レッカー移動される。" }
    ]
  },
  {
    id:"b11", level:"beginner", type:"Email",
    title:"E-mail",
    body:"From: Anna Brown\nTo: Front Desk\nSubject: Room Change Request\n\nHello,\n\nI am currently staying in Room 305 until Sunday. The air conditioner in my room is too noisy. Could I please change to a quieter room? I would prefer a non-smoking room on a higher floor.\n\nThank you,\nAnna Brown",
    questions:[
      { q:"What is the problem in Anna's room?",
        options:["The TV does not work","The room is too small","The air conditioner is noisy","The window is broken"],
        answer:2,

    id:"a03", level:"advanced", type:"Article",
    title:"Editorial",
    body:"Why the New Tariff Framework Misses the Mark\n\nThe newly announced tariff framework, while undoubtedly well-intentioned, fundamentally misunderstands the complexity of contemporary supply chains. By imposing uniform duties on a broad category of imported components, policymakers appear to assume that domestic alternatives can scale rapidly enough to absorb displaced demand. The evidence, however, suggests otherwise.\n\nDomestic manufacturers, having ceded much of this segment over the past two decades, lack both the production capacity and specialized expertise required to fill the gap in the short term. Industry estimates indicate that ramping up domestic output to meaningful levels would require, at minimum, three to five years of sustained capital investment—precisely the kind of investment that becomes harder to justify when end-product prices rise sharply and consumer demand falters.\n\nA more nuanced approach would have been to introduce tariffs on a phased basis, paired with targeted subsidies for domestic capacity expansion. Such a framework would have given producers time to invest and consumers time to adjust. Instead, the current policy risks producing the worst of both outcomes: higher prices for buyers and stagnant production from a sector still unprepared to meet demand.",

    id:"a06", level:"advanced", type:"Article",
    title:"Industry Report",
    body:"The Shifting Economics of Commercial Real Estate\n\nThe commercial real estate sector is undergoing a structural recalibration whose implications extend well beyond the headline vacancy statistics. While much commentary has focused on the declining demand for traditional office space, a more interesting story is unfolding in the secondary and tertiary markets, where landlords are demonstrating a creativity that was largely absent during the long bull run that preceded the recent downturn.\n\nIn cities such as Cincinnati, Pittsburgh, and Indianapolis, owners of dated Class B and Class C properties are pursuing conversion strategies—most commonly to multifamily residential, but increasingly to mixed-use formats incorporating life-sciences laboratories, light industrial, or even data center capacity. These conversions are rarely straightforward; floor-plate dimensions, mechanical systems, and zoning rules all conspire against easy adaptation. Yet the alternative—prolonged vacancy followed by eventual distressed sale—has become so unattractive that landlords are willing to absorb significant upfront cost.\n\nWhat is striking is how few of these projects rely on public subsidy. Sophisticated capital partners, particularly mid-sized private equity funds with longer hold horizons than the traditional five-to-seven-year windows, are providing the patient money these transformations require. This suggests that the next phase of urban redevelopment may be driven less by city planning departments than by a generation of investors willing to underwrite slower, more complex returns.",

    id:"a07", level:"advanced", type:"Memo",
    title:"Internal Memorandum",
    body:"INTERNAL MEMORANDUM — PRIVILEGED AND CONFIDENTIAL\n\nTo: Executive Leadership Team\nFrom: Office of the General Counsel\nDate: September 18\nRe: Preliminary Findings — Vendor Onboarding Review\n\nFollowing the inquiries raised at the August audit committee meeting, the Office of the General Counsel has completed its preliminary review of the vendor onboarding process. We present below our headline findings and a recommended course of action. A full report will follow within ten business days.\n\nFirst, our review confirms that the onboarding workflow, as currently implemented, does not consistently capture conflict-of-interest disclosures from vendor principals. While the procurement manual nominally requires such disclosures, the relevant prompts in our procurement software were disabled during the system migration last year and have not been restored. As a result, an estimated 38 percent of vendors onboarded since the migration lack any conflict disclosure on file.\n\nSecond, sanctions screening, while operationally robust, is not being repeated at the intervals required under our internal policy. The policy contemplates quarterly re-screening of all active vendors; in practice, re-screening has occurred only at contract renewal.\n\nWe recommend, at minimum, (i) immediate restoration of the disabled conflict prompts, (ii) a retroactive collection of disclosures from the affected vendor cohort, and (iii) implementation of automated quarterly sanctions re-screening. We do not, at this stage, recommend voluntary disclosure to regulators, though we will reassess this position once the full report is complete.\n\nQuestions may be directed to the undersigned.",

    id:"a08", level:"advanced", type:"Email",
    title:"E-mail",
    body:"From: Aldous Pemberton <a.pemberton@orionresearch.com>\nTo: Research Subscribers\nSubject: Q3 Outlook — Semiconductors\n\nDear Subscribers,\n\nOur Q3 outlook for the semiconductor sector reflects a more cautious posture than the consensus, though we remain constructive on a longer horizon. Three considerations underpin our view.\n\nFirst, while AI-driven demand for advanced logic and high-bandwidth memory remains robust, the broader analog and power-management segments are exhibiting clear signs of inventory correction. Channel-check data from our Asia desk suggests that distributor inventories have risen for three consecutive months, a pattern that historically precedes a 10 to 15 percent revision to consensus revenue estimates over the subsequent two quarters.\n\nSecond, capital expenditure guidance from the major foundries appears increasingly bifurcated. Leading-edge investment continues largely unabated, but mature-node capacity additions—announced with considerable fanfare during the 2023 shortage—are being quietly scaled back. We expect this divergence to widen, which has implications for the equipment suppliers we cover, particularly those with disproportionate exposure to legacy node tooling.\n\nThird, we caution that policy risk remains underpriced. Recent export-control adjustments have so far proved more bark than bite, but the trajectory of administrative action is unambiguous. Companies whose revenue depends heavily on a single jurisdiction face elevated risk, which we do not believe is reflected in current valuations.\n\nDespite these near-term concerns, we maintain our positive long-term thesis. The structural drivers—electrification, AI acceleration, and edge compute proliferation—remain intact, and we view weakness in the coming quarters as an opportunity to build positions in the highest-quality names at more attractive entry points.\n\nRegards,\nAldous Pemberton\nHead of Semiconductor Research",

    body:"From: Elena Voskresenskaya <evosk@continental-arch.com>\nTo: Harold Wexler\nSubject: Tendering Strategy — Brookhaven Civic Center\n\nHarold,\n\nI have been thinking about our position on the Brookhaven Civic Center tender, and I want to share a few concerns before we commit to the approach you outlined yesterday.\n\nThe project brief, as written, is unusually prescriptive about programmatic elements that I suspect will prove unworkable at the proposed budget. The auditorium specification alone, with its 1,400-seat capacity and the acoustic standards referenced in Appendix C, is difficult to reconcile with the $48 million construction allowance—particularly when one accounts for the site conditions revealed in last week's geotechnical report. My back-of-the-envelope numbers suggest we would need to either compromise on the acoustic standard or absorb a meaningful overrun.\n\nRather than submit a bid that papers over these tensions, I would propose we use the question-and-answer period to surface them explicitly. If the client is open to a value-engineered alternative—perhaps an 1,100-seat configuration with the option to expand—we can submit competitively. If they are not, we may be better served by declining to bid and preserving our reputation for honest delivery. I would rather lose this opportunity than win and disappoint.\n\nI realize this departs from the more aggressive posture you favored, and I am open to discussing it further. Are you free for thirty minutes on Tuesday morning?\n\nElena",

/* ==================== グローバル状態 ==================== */
let currentLevel = "beginner";
let currentPassageIndex = 0;
let currentQuestionIndex = 0;
let correctCount = 0;
let totalAnswered = 0;
let answeredFlags = []; // 各パッセージの各問題が回答済みかどうか
let levelPassages = []; // 現在のレベルのパッセージ（シャッフル済み）

/* ==================== Fisher-Yates シャッフル ==================== */
function shuffle(array){
  const a = array.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ==================== レベルの問題数カウント ==================== */
function countQuestionsInLevel(level){
  return passages.filter(p=>p.level===level).reduce((sum,p)=>sum+p.questions.length, 0);
}

/* ==================== レベル切替 ==================== */
function switchLevel(level){
  currentLevel = level;
  currentPassageIndex = 0;
  currentQuestionIndex = 0;
  correctCount = 0;
  totalAnswered = 0;
  levelPassages = shuffle(passages.filter(p=>p.level===level));
  answeredFlags = levelPassages.map(p=>p.questions.map(()=>false));
  document.querySelectorAll(".level-tab").forEach(t=>{
    t.classList.toggle("active", t.dataset.level===level);
  });
  document.getElementById("levelBadge").textContent =
    level==="beginner" ? "初級" : level==="intermediate" ? "中級" : "上級";
  render();
}

/* ==================== レンダリング ==================== */
function render(){
  const main = document.getElementById("main");
  // 終了判定
  if(currentPassageIndex >= levelPassages.length){
    showSummary();
    return;
  }
  const passage = levelPassages[currentPassageIndex];
  const totalQ = countQuestionsInLevel(currentLevel);
  // ヘッダー更新
  document.getElementById("scoreDisplay").textContent = `スコア: ${correctCount} / ${totalAnswered}`;
  const progress = (totalAnswered / totalQ) * 100;
  document.getElementById("progressFill").style.width = progress + "%";
  document.getElementById("progressText").textContent = `${totalAnswered} / ${totalQ}`;
  // パッセージ＋設問群を描画
  let html = `
    <div class="passage-card">
      <div class="passage-meta">
        <span class="passage-type">${passage.type}</span>
        <span class="q-counter">パッセージ ${currentPassageIndex+1} / ${levelPassages.length}</span>
      </div>
      <div class="passage-text">${escapeHtml(passage.body)}</div>
    </div>
  `;
  // 各設問
  passage.questions.forEach((q, qi)=>{
    const answered = answeredFlags[currentPassageIndex][qi];
    html += renderQuestion(passage, q, qi, answered);
  });
  main.innerHTML = html;
  // 選択肢クリックイベント
  document.querySelectorAll(".option").forEach(btn=>{
    btn.addEventListener("click", onOptionClick);
  });
  // 次へボタン
  document.querySelectorAll(".next-btn").forEach(btn=>{
    btn.addEventListener("click", goNext);
  });
  // スクロールトップ
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderQuestion(passage, q, qi, answered){
  const labels = ["A","B","C","D"];
  let optionsHtml = q.options.map((opt, oi)=>{
    let cls = "option";
    let icon = "";
    if(answered){
      if(oi === q.answer){ cls += " correct"; icon = '<span class="option-icon">✅</span>'; }
      else if(answered.selected === oi){ cls += " wrong"; icon = '<span class="option-icon">❌</span>'; }
    }
    return `<button class="${cls}" data-qi="${qi}" data-oi="${oi}" ${answered?'disabled':''}>
      <span class="option-label">${labels[oi]}</span>
      <span>${escapeHtml(opt)}</span>
      ${icon}
    </button>`;
  }).join("");
  let explanationHtml = "";
  if(answered){
    explanationHtml = `
      <div class="explanation">
        <h4>📘 解説</h4>
        <p>${escapeHtml(q.explanation)}</p>
        ${qi === passage.questions.length-1 ? `<button class="next-btn">次のパッセージへ ▶</button>` : ""}
      </div>
    `;
  }
  return `
    <div class="question-card" data-qi="${qi}">
      <div class="q-header">
        <span class="q-number">Q${qi+1}</span>
      </div>
      <div class="q-text">${escapeHtml(q.q)}</div>
      <div class="options">${optionsHtml}</div>
      ${explanationHtml}
    </div>
  `;
}

/* ==================== HTMLエスケープ ==================== */
function escapeHtml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ==================== 選択肢クリック処理 ==================== */
function onOptionClick(e){
  const btn = e.currentTarget;
  const qi = parseInt(btn.dataset.qi);
  const oi = parseInt(btn.dataset.oi);
  const passage = levelPassages[currentPassageIndex];
  const q = passage.questions[qi];
  // すでに回答済みなら無視
  if(answeredFlags[currentPassageIndex][qi]) return;
  const isCorrect = (oi === q.answer);
  answeredFlags[currentPassageIndex][qi] = { selected: oi, correct: isCorrect };
  totalAnswered++;
  if(isCorrect) correctCount++;
  // 不正解時 → Notion苦手DB送信
  if(!isCorrect) sendMistakeToNotion(passage, q, oi);
  render();
}

/* ==================== 次へ ==================== */
function goNext(){
  currentPassageIndex++;
  currentQuestionIndex = 0;
  render();
}

/* ==================== サマリ画面 ==================== */
function showSummary(){
  const totalQ = countQuestionsInLevel(currentLevel);
  const pct = totalQ ? Math.round((correctCount/totalQ)*100) : 0;
  const levelName = currentLevel==="beginner" ? "初級" : currentLevel==="intermediate" ? "中級" : "上級";
  document.getElementById("main").innerHTML = `
    <div class="summary">
      <h2>🎉 セッション完了！</h2>
      <p>お疲れさまでした！結果は以下のとおりです。</p>
      <div class="score-grid">
        <div class="score-box">
          <div class="lv">${levelName}</div>
          <div class="num">${correctCount} / ${totalQ}</div>
          <div class="pct">正答率 ${pct}%</div>
        </div>
      </div>
      <div class="summary-buttons">
        <button onclick="switchLevel('${currentLevel}')">🔄 もう一度</button>
        <button onclick="switchLevel('beginner')">初級へ</button>
        <button onclick="switchLevel('intermediate')">中級へ</button>
        <button onclick="switchLevel('advanced')">上級へ</button>
      </div>
    </div>
  `;
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("progressText").textContent = `${totalAnswered} / ${totalQ}`;
  document.getElementById("scoreDisplay").textContent = `スコア: ${correctCount} / ${totalAnswered}`;
  // Notionスコア送信
  sendScoreToNotion(correctCount, totalQ, pct, levelName);
}

/* ==================== Notion連携 ==================== */
function getNotionConfig(){
  return {
    token: localStorage.getItem("notion_token") || "",
    scoreDb: localStorage.getItem("notion_score_db") || "",
    mistakeDb: localStorage.getItem("notion_mistake_db") || ""
  };
}

async function sendMistakeToNotion(passage, q, selectedIndex){
  const cfg = getNotionConfig();
  if(!cfg.token || !cfg.mistakeDb) return;
  const levelName = currentLevel==="beginner" ? "初級" : currentLevel==="intermediate" ? "中級" : "上級";
  const titleText = (q.q.slice(0,30));
  const body = {
    parent: { database_id: cfg.mistakeDb },
    properties: {
      "タイトル": { title: [{ text: { content: titleText } }] },
      "Part": { select: { name: "Part 7" } },
      "レベル": { select: { name: levelName } },
      "問題全文": { rich_text: [{ text: { content: (passage.body+"\n\nQ: "+q.q).slice(0,1900) } }] },
      "自分の解答": { rich_text: [{ text: { content: q.options[selectedIndex].slice(0,1900) } }] },
      "正解": { rich_text: [{ text: { content: q.options[q.answer].slice(0,1900) } }] },
      "解説": { rich_text: [{ text: { content: q.explanation.slice(0,1900) } }] },
      "間違えた日": { date: { start: new Date().toISOString() } }
    }
  };
  try{
    const res = await fetch("https://api.notion.com/v1/pages", {
      method:"POST",
      headers:{
        "Authorization":"Bearer "+cfg.token,
        "Notion-Version":"2022-06-28",
        "Content-Type":"application/json"
      },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const errTxt = await res.text();
      showToast("Notion送信失敗: "+errTxt.slice(0,80), "error");
    } else {
      showToast("✅ 苦手問題を記録しました", "success");
    }
  } catch(e){
    showToast("Notion送信失敗: "+e.message, "error");
  }
}

async function sendScoreToNotion(correct, total, pct, levelName){
  const cfg = getNotionConfig();
  if(!cfg.token || !cfg.scoreDb) return;
  const today = new Date().toISOString().slice(0,10);
  const body = {
    parent: { database_id: cfg.scoreDb },
    properties: {
      "タイトル": { title: [{ text: { content: `Part 7 ${levelName} ${today}` } }] },
      "Part": { select: { name: "Part 7" } },
      "レベル": { select: { name: levelName } },
      "正答数": { number: correct },
      "出題数": { number: total },
      "正答率": { number: pct },
      "学習日": { date: { start: new Date().toISOString() } }
    }
  };
  try{
    const res = await fetch("https://api.notion.com/v1/pages", {
      method:"POST",
      headers:{
        "Authorization":"Bearer "+cfg.token,
        "Notion-Version":"2022-06-28",
        "Content-Type":"application/json"
      },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const errTxt = await res.text();
      showToast("スコア送信失敗: "+errTxt.slice(0,80), "error");
    } else {
      showToast("✅ Notionに記録しました", "success");
    }
  } catch(e){
    showToast("スコア送信失敗: "+e.message, "error");
  }
}

/* ==================== トースト通知 ==================== */
function showToast(msg, type){
  const t = document.createElement("div");
  t.className = "toast " + (type||"");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transform="translateY(20px)"; }, 1800);
  setTimeout(()=>t.remove(), 2200);
}

/* ==================== 設定モーダル ==================== */
function openSettings(){
  document.getElementById("notionToken").value = localStorage.getItem("notion_token") || "";
  document.getElementById("scoreDbId").value = localStorage.getItem("notion_score_db") || "";
  document.getElementById("mistakeDbId").value = localStorage.getItem("notion_mistake_db") || "";
  document.getElementById("modalBg").classList.add("show");
}
function closeSettings(){
  document.getElementById("modalBg").classList.remove("show");
}
function saveSettings(){
  localStorage.setItem("notion_token", document.getElementById("notionToken").value.trim());
  localStorage.setItem("notion_score_db", document.getElementById("scoreDbId").value.trim());
  localStorage.setItem("notion_mistake_db", document.getElementById("mistakeDbId").value.trim());
  closeSettings();
  showToast("✅ 設定を保存しました", "success");
}

/* ==================== 初期化 ==================== */
document.querySelectorAll(".level-tab").forEach(t=>{
  t.addEventListener("click", ()=>switchLevel(t.dataset.level));
});
document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("modalCancel").addEventListener("click", closeSettings);
document.getElementById("modalSave").addEventListener("click", saveSettings);
document.getElementById("modalBg").addEventListener("click", (e)=>{
  if(e.target.id==="modalBg") closeSettings();
});

// 初回起動
switchLevel("beginner");
</script>
